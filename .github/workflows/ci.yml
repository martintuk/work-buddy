name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck --version && shellcheck scripts/*.sh scripts/lib/*.sh

  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Swift tests
        run: ./scripts/test.sh
      - name: Script tests
        run: python3 -m unittest discover -s Tests/scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - name: Build app bundle
        run: ./scripts/build.sh release
